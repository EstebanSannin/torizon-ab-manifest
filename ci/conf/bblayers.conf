# bblayers for the torizon-ab A/B variant — used by ci/build.sh.
# OEROOT=/workdir because the tree is bind-mounted at /workdir inside crops.
# Mirrors meta-torizon-bsp's conf/template/bblayers.conf (Torizon OS 8, the file
# upstream's setup-environment copies verbatim), with the three overlay layers
# from torizon-ab/overlay.xml in EXTRALAYERS — the slot upstream provides for it.
LCONF_VERSION = "7"
OEROOT := "/workdir"

BBPATH = "${TOPDIR}"
BBFILES = ""

# These layers hold recipe metadata not found in OE-core, but lack any machine or distro content
BASELAYERS ?= " \
  ${OEROOT}/layers/meta-openembedded/meta-oe \
  ${OEROOT}/layers/meta-openembedded/meta-networking \
  ${OEROOT}/layers/meta-openembedded/meta-filesystems \
  ${OEROOT}/layers/meta-openembedded/meta-python \
  ${OEROOT}/layers/meta-openembedded/meta-perl \
  ${OEROOT}/layers/meta-virtualization \
  ${OEROOT}/layers/meta-updater \
  ${OEROOT}/layers/meta-cyclonedx \
"

# These layers hold machine specific content, aka Board Support Packages
BSPLAYERS ?= " \
  ${OEROOT}/layers/meta-toradex-bsp/meta-toradex-nxp \
  ${OEROOT}/layers/meta-freescale \
  ${OEROOT}/layers/meta-freescale-ml \
  ${OEROOT}/layers/meta-yocto/meta-yocto-bsp \
  ${OEROOT}/layers/meta-yocto/meta-poky \
  ${OEROOT}/layers/meta-security \
  ${OEROOT}/layers/meta-toradex-bsp/meta-toradex-ti \
  ${OEROOT}/layers/meta-arm/meta-arm-toolchain \
  ${OEROOT}/layers/meta-arm/meta-arm \
  ${OEROOT}/layers/meta-ti/meta-ti-bsp \
  ${OEROOT}/layers/meta-ti/meta-ti-extras \
  ${OEROOT}/layers/meta-imx/meta-imx-ml \
"

# The torizon-ab overlay layers (torizon-ab/overlay.xml).
EXTRALAYERS ?= " \
  ${OEROOT}/layers/meta-swupdate \
  ${OEROOT}/layers/meta-rauc \
  ${OEROOT}/layers/meta-torizon-ab \
"

BBLAYERS = " \
  ${OEROOT}/layers/meta-torizon-bsp \
  ${OEROOT}/layers/meta-torizon \
  ${OEROOT}/layers/meta-toradex-security \
  ${OEROOT}/layers/meta-toradex-bsp/meta-toradex-bsp-common \
  ${OEROOT}/layers/meta-security/meta-tpm \
  ${BASELAYERS} \
  ${BSPLAYERS} \
  ${EXTRALAYERS} \
  ${OEROOT}/layers/openembedded-core/meta \
"
