# local.conf for the torizon-ab A/B variant — used by ci/build.sh.
# MACHINE + DISTRO come from the environment (exported before oe-init-build-env).
# DL_DIR/SSTATE_DIR here are weak defaults; ci/build.sh's auto.conf overrides them
# to the shared caches (/dl, /sstate). The jq out-of-tree build fix is provided by
# meta-torizon-ab's bbappend, so it is NOT needed here.
CONF_VERSION = "2"
BBMASK = ""
PATCHRESOLVE = "noop"

BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

include conf/machine/include/${MACHINE}.inc

DL_DIR ?= "/workdir/downloads"
SSTATE_DIR ?= "/workdir/sstate-cache"

# Some build hosts have a broken IPv6 route to certain CDNs.
FETCHCMD_wget = "/usr/bin/env wget -t 5 -T 120 --inet4-only --waitretry=5 --retry-connrefused"

# NXP/Freescale EULA (needed for i.MX BSP fetches).
ACCEPT_FSL_EULA = "1"
