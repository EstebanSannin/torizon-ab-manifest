name: build

# M1 pipeline: build the OSTree-free A/B variant on the m920x self-hosted runner
# and publish each build as a GitHub Release. Runs weekly (full matrix) and on
# demand (targeted, or "all"/"both" to fan out).

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Target machine
        type: choice
        default: genericx86-64
        options: [all, genericx86-64, verdin-am62p, verdin-imx8mp]
      backend:
        description: Updater backend
        type: choice
        default: rauc
        options: [both, rauc, swupdate]
      channel:
        description: Manifest channel
        type: choice
        default: integration
        options: [release, integration, next]
  schedule:
    - cron: '0 2 * * 0'          # weekly — Sunday 02:00 UTC

permissions:
  contents: write                # create releases + upload assets via GITHUB_TOKEN

env:
  # machine/backend combos validated on this branch's OS version. Every combo is
  # built; only these are published as GitHub Releases.
  VALIDATED: verdin-imx8mp/rauc verdin-imx8mp/swupdate genericx86-64/rauc genericx86-64/swupdate verdin-am62p/rauc verdin-am62p/swupdate

jobs:
  # Expand the build matrix: full set for the weekly schedule (or all/both),
  # otherwise the single combo the dispatch asked for.
  setup:
    runs-on: [self-hosted, m920x]
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      channel: ${{ steps.gen.outputs.channel }}
    steps:
      - id: gen
        run: |
          set -e
          # Full matrix: 3 machines x 2 backends. am62p-swupdate wired + HW
          # boot-validated (meta-torizon-ab roadmap B15).
          ALL='[{"machine":"genericx86-64","backend":"rauc"},{"machine":"genericx86-64","backend":"swupdate"},{"machine":"verdin-am62p","backend":"rauc"},{"machine":"verdin-am62p","backend":"swupdate"},{"machine":"verdin-imx8mp","backend":"rauc"},{"machine":"verdin-imx8mp","backend":"swupdate"}]'
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "matrix={\"include\":$ALL}" >> "$GITHUB_OUTPUT"
            echo "channel=integration" >> "$GITHUB_OUTPUT"   # release.xml lags on 8
          else
            m='${{ inputs.machine }}'; b='${{ inputs.backend }}'
            [ "$m" = all ]  && machines='genericx86-64 verdin-am62p verdin-imx8mp' || machines="$m"
            [ "$b" = both ] && backends='rauc swupdate' || backends="$b"
            inc=""
            for mm in $machines; do for bb in $backends; do inc="$inc{\"machine\":\"$mm\",\"backend\":\"$bb\"},"; done; done
            echo "matrix={\"include\":[${inc%,}]}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: [self-hosted, m920x]
    timeout-minutes: 480
    strategy:
      fail-fast: false           # one machine/backend failing must not sink the rest
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      group: build-${{ matrix.machine }}-${{ matrix.backend }}
      cancel-in-progress: false
    steps:
      - name: Checkout manifest repo (for ci/*.sh)
        uses: actions/checkout@v4

      - name: Build ${{ matrix.machine }} / ${{ matrix.backend }}
        env:
          MACHINE: ${{ matrix.machine }}
          CHANNEL: ${{ needs.setup.outputs.channel }}
          MANIFEST_BRANCH: ${{ github.ref_name }}   # build the manifest of the branch this runs on
          OUT_DIR: ${{ github.workspace }}/artifacts
          REPORT_DIR: ${{ github.workspace }}/report
        run: |
          case "${{ matrix.backend }}" in
            rauc)     export DISTRO=torizon-ab-rauc ;;
            swupdate) export DISTRO=torizon-ab ;;
          esac
          chmod +x ci/build.sh
          ./ci/build.sh

      # Green: the tip built. Warning: the tip broke, the last good upstream pins
      # built (upstream drift). Error: both broke, or the build never got going.
      - name: Report ${{ matrix.machine }} / ${{ matrix.backend }}
        if: always()
        env:
          REPORT_DIR: ${{ github.workspace }}/report
        run: |
          combo="${{ matrix.machine }} / ${{ matrix.backend }}"
          if [ ! -f "$REPORT_DIR/status.env" ]; then
            echo "::error title=$combo::No build report: the build stopped before bitbake ran (sync or setup)."
            echo "### $combo: no report (stopped before bitbake)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          . "$REPORT_DIR/status.env"
          case "$RESULT" in
            fallback) echo "::warning title=Upstream drift broke $combo::The branch-tip layers did not build; this build used the last good upstream pins ($LAST_GOOD_DATE). See the job summary." ;;
            failed)   echo "::error title=$combo failed::Failed with pins=$PINS. See the job summary." ;;
          esac
          {
            echo "### $combo: $RESULT (pins: $PINS)"
            for f in errors.txt upstream-delta.txt; do
              [ -s "$REPORT_DIR/$f" ] || continue
              printf '\n<details><summary>%s</summary>\n\n```\n' "$f"
              cat "$REPORT_DIR/$f"
              printf '```\n</details>\n'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.machine }}-${{ matrix.backend }}
          path: ${{ github.workspace }}/report
          if-no-files-found: ignore
          retention-days: 30

      - name: Publish to GitHub Releases
        if: contains(format(' {0} ', env.VALIDATED), format(' {0}/{1} ', matrix.machine, matrix.backend))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ART_DIR: ${{ github.workspace }}/artifacts
          TARGET_COMMITISH: ${{ github.sha }}
          # Only release-channel builds are releases; everything else is a preview.
          PRERELEASE: ${{ needs.setup.outputs.channel != 'release' }}
        run: |
          chmod +x ci/publish-release.sh
          ./ci/publish-release.sh

      - name: Upload manifest (checksums + metadata) to the run
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.machine }}-${{ matrix.backend }}
          path: |
            ${{ github.workspace }}/artifacts/SHA256SUMS
            ${{ github.workspace }}/artifacts/metadata.env
          if-no-files-found: error
          retention-days: 14

  # One table for the whole run: what built, what fell back, what failed.
  summary:
    needs: [setup, build]
    if: always()
    runs-on: [self-hosted, m920x]
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true    # no reports when setup itself failed
        with:
          pattern: report-*
          path: reports
      - name: Summarize
        run: |
          {
            echo "## torizon-ab build: channel ${{ needs.setup.outputs.channel }}"
            echo
            echo "| machine | backend | result | pins |"
            echo "|---|---|---|---|"
            for s in reports/*/status.env; do
              [ -f "$s" ] || continue
              ( . "$s"; echo "| $MACHINE | $BACKEND | $RESULT | $PINS |" )
            done
            echo
            echo "build jobs: ${{ needs.build.result }}"
          } | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: summary
          path: summary.md
          retention-days: 30
