name: build

# M1 pipeline: build the OSTree-free A/B variant on the m920x self-hosted runner
# and publish each build as a GitHub Release. Runs weekly (full matrix) and on
# demand (targeted, or "all"/"both" to fan out).

on:
  workflow_dispatch:
    inputs:
      machine:
        description: Target machine
        type: choice
        default: genericx86-64
        options: [all, genericx86-64, verdin-am62p, verdin-imx8mp]
      backend:
        description: Updater backend
        type: choice
        default: rauc
        options: [both, rauc, swupdate]
      channel:
        description: Manifest channel
        type: choice
        default: release
        options: [release, nightly, next]
  schedule:
    - cron: '0 2 * * 0'          # weekly — Sunday 02:00 UTC

permissions:
  contents: write                # create releases + upload assets via GITHUB_TOKEN

jobs:
  # Expand the build matrix: full set for the weekly schedule (or all/both),
  # otherwise the single combo the dispatch asked for.
  setup:
    runs-on: [self-hosted, m920x]
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      channel: ${{ steps.gen.outputs.channel }}
    steps:
      - id: gen
        run: |
          set -e
          ALL='[{"machine":"genericx86-64","backend":"rauc"},{"machine":"genericx86-64","backend":"swupdate"},{"machine":"verdin-am62p","backend":"rauc"},{"machine":"verdin-am62p","backend":"swupdate"},{"machine":"verdin-imx8mp","backend":"rauc"},{"machine":"verdin-imx8mp","backend":"swupdate"}]'
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "matrix={\"include\":$ALL}" >> "$GITHUB_OUTPUT"
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            m='${{ inputs.machine }}'; b='${{ inputs.backend }}'
            [ "$m" = all ]  && machines='genericx86-64 verdin-am62p verdin-imx8mp' || machines="$m"
            [ "$b" = both ] && backends='rauc swupdate' || backends="$b"
            inc=""
            for mm in $machines; do for bb in $backends; do inc="$inc{\"machine\":\"$mm\",\"backend\":\"$bb\"},"; done; done
            echo "matrix={\"include\":[${inc%,}]}" >> "$GITHUB_OUTPUT"
            echo "channel=${{ inputs.channel }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    runs-on: [self-hosted, m920x]
    timeout-minutes: 480
    strategy:
      fail-fast: false           # one machine/backend failing must not sink the rest
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    concurrency:
      group: build-${{ matrix.machine }}-${{ matrix.backend }}
      cancel-in-progress: false
    steps:
      - name: Checkout manifest repo (for ci/*.sh)
        uses: actions/checkout@v4

      - name: Build ${{ matrix.machine }} / ${{ matrix.backend }}
        env:
          MACHINE: ${{ matrix.machine }}
          CHANNEL: ${{ needs.setup.outputs.channel }}
          OUT_DIR: ${{ github.workspace }}/artifacts
        run: |
          case "${{ matrix.backend }}" in
            rauc)     export DISTRO=torizon-ab-rauc ;;
            swupdate) export DISTRO=torizon-ab ;;
          esac
          chmod +x ci/build.sh
          ./ci/build.sh

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ART_DIR: ${{ github.workspace }}/artifacts
          TARGET_COMMITISH: ${{ github.sha }}
        run: |
          chmod +x ci/publish-release.sh
          ./ci/publish-release.sh

      - name: Upload manifest (checksums + metadata) to the run
        uses: actions/upload-artifact@v4
        with:
          name: metadata-${{ matrix.machine }}-${{ matrix.backend }}
          path: |
            ${{ github.workspace }}/artifacts/SHA256SUMS
            ${{ github.workspace }}/artifacts/metadata.env
          if-no-files-found: error
          retention-days: 14
